plugins { id 'com.android.application' }
android {
    namespace 'com.wayudiesa.streamgolite'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wayudiesa.streamgolite'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.1.0-beta'
    }
    buildTypes {
        debug { applicationIdSuffix '.beta' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Chrome Custom Tabs provides a secure browser session shared with Chrome.
dependencies { implementation 'androidx.browser:browser:1.8.0' }
